<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="srcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="dfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="imgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="runGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="980" height="600" fill="url(#bgGrad)" rx="16"/>

  <rect x="25" y="20" width="930" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="490" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">KIẾN TRÚC SINGLE-STAGE DOCKERFILE ĐÓNG GÓI NODE.JS BACKEND</text>
  <text x="490" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">node:18-alpine • WORKDIR /app • COPY • RUN npm install • ENV PORT=3000 • EXPOSE 3000 • CMD exec form</text>

  <!-- Step 1: Source Files -->
  <g transform="translate(35, 105)">
    <rect width="210" height="360" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="210" height="40" rx="12" fill="url(#srcGrad)"/>
    <text x="105" y="26" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1. MÃ NGUỒN APP</text>

    <g transform="translate(12, 55)">
      <rect width="186" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="93" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">package.json</text>
      <text x="15" y="40" font-family="monospace" font-size="9" fill="#cbd5e1">"name": "ex2-backend"</text>
      <text x="15" y="55" font-family="monospace" font-size="9" fill="#cbd5e1">"dependencies": {</text>
      <text x="25" y="70" font-family="monospace" font-size="9" fill="#fef08a">"express": "^4.18.2"</text>
    </g>

    <g transform="translate(12, 150)">
      <rect width="186" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="93" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">server.js</text>
      <text x="15" y="40" font-family="monospace" font-size="8.5" fill="#cbd5e1">express = require('express')</text>
      <text x="15" y="58" font-family="monospace" font-size="8.5" fill="#cbd5e1">PORT = process.env.PORT</text>
      <text x="15" y="76" font-family="monospace" font-size="8.5" fill="#fef08a">app.get('/', res.json(...))</text>
      <text x="15" y="94" font-family="monospace" font-size="8.5" fill="#cbd5e1">app.listen(PORT, ...)</text>
    </g>

    <g transform="translate(12, 270)">
      <rect width="186" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="93" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">.dockerignore</text>
      <text x="15" y="42" font-family="monospace" font-size="9" fill="#94a3b8">node_modules</text>
      <text x="15" y="58" font-family="monospace" font-size="9" fill="#94a3b8">npm-debug.log</text>
    </g>
  </g>

  <!-- Step 2: Dockerfile Pipeline -->
  <g transform="translate(265, 105)">
    <rect width="230" height="360" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="230" height="40" rx="12" fill="url(#dfGrad)"/>
    <text x="115" y="26" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2. CHỈ THỊ DOCKERFILE</text>

    <g transform="translate(12, 50)" font-family="monospace" font-size="9.5">
      <rect width="206" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="22" fill="#c084fc">FROM node:18-alpine</text>

      <rect y="42" width="206" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="64" fill="#c084fc">WORKDIR /app</text>

      <rect y="84" width="206" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="106" fill="#c084fc">ENV PORT=3000</text>

      <rect y="126" width="206" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="148" fill="#c084fc">COPY package.json ./</text>

      <rect y="168" width="206" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="190" fill="#fef08a">RUN npm install</text>

      <rect y="210" width="206" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="232" fill="#c084fc">COPY server.js ./</text>

      <rect y="252" width="206" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="274" fill="#38bdf8">EXPOSE 3000</text>

      <rect y="294" width="206" height="36" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="316" fill="#34d399">CMD ["node","server.js"]</text>
    </g>
  </g>

  <!-- Step 3: Docker Image Artifact -->
  <g transform="translate(515, 105)">
    <rect width="200" height="360" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="200" height="40" rx="12" fill="url(#imgGrad)"/>
    <text x="100" y="26" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3. DOCKER IMAGE</text>

    <g transform="translate(12, 55)">
      <rect width="176" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="88" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Image Name &amp; Tag</text>
      <text x="88" y="46" font-family="monospace" font-size="11.5" font-weight="700" fill="#fef08a" text-anchor="middle">hw-backend:v1</text>
      <text x="88" y="70" font-family="sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Dung lượng: ~174 MB</text>
    </g>

    <g transform="translate(12, 155)">
      <rect width="176" height="185" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="88" y="22" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Các tầng Layer Cache</text>
      <rect x="15" y="36" width="146" height="26" rx="4" fill="#334155"/>
      <text x="88" y="53" font-family="monospace" font-size="8.5" fill="#cbd5e1" text-anchor="middle">server.js (Layer)</text>

      <rect x="15" y="68" width="146" height="26" rx="4" fill="#334155"/>
      <text x="88" y="85" font-family="monospace" font-size="8.5" fill="#cbd5e1" text-anchor="middle">node_modules (Layer)</text>

      <rect x="15" y="100" width="146" height="26" rx="4" fill="#334155"/>
      <text x="88" y="117" font-family="monospace" font-size="8.5" fill="#cbd5e1" text-anchor="middle">package.json (Layer)</text>

      <rect x="15" y="132" width="146" height="40" rx="4" fill="#1e293b" stroke="#475569"/>
      <text x="88" y="148" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Node 18 Runtime +</text>
      <text x="88" y="162" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Alpine Linux Base</text>
    </g>
  </g>

  <!-- Step 4: Container Runtime -->
  <g transform="translate(735, 105)">
    <rect width="210" height="360" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="210" height="40" rx="12" fill="url(#runGrad)"/>
    <text x="105" y="26" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4. RUN &amp; VERIFY</text>

    <g transform="translate(12, 55)">
      <rect width="186" height="95" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="93" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Khởi chạy Container</text>
      <text x="93" y="40" font-family="monospace" font-size="8.5" fill="#cbd5e1" text-anchor="middle">--name app-single-stage</text>
      <text x="93" y="58" font-family="monospace" font-size="9" fill="#fef08a" text-anchor="middle">-p 8080:3000</text>
      <text x="93" y="76" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Trạng thái: Up (healthy)</text>
    </g>

    <g transform="translate(12, 160)">
      <rect width="186" height="180" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
      <text x="93" y="22" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">KẾT QUẢ CURL -I</text>
      <text x="15" y="44" font-family="monospace" font-size="8.5" fill="#38bdf8">HTTP/1.1 200 OK</text>
      <text x="15" y="60" font-family="monospace" font-size="8" fill="#94a3b8">Content-Type: json</text>
      
      <rect x="8" y="74" width="170" height="92" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="93" y="94" font-family="sans-serif" font-size="9" font-weight="600" fill="#fbbf24" text-anchor="middle">JSON RESPONSE:</text>
      <text x="15" y="116" font-family="monospace" font-size="8" fill="#fef08a">"status": "success"</text>
      <text x="15" y="134" font-family="monospace" font-size="7.5" fill="#cbd5e1">"message": "Hello from</text>
      <text x="25" y="150" font-family="monospace" font-size="7.5" fill="#cbd5e1">Docker Single-stage!"</text>
    </g>
  </g>

  <!-- Bottom workflow summary -->
  <g transform="translate(35, 485)">
    <rect width="910" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">ĐIỂM NHẤN KỸ THUẬT SINGLE-STAGE:</text>
    <text x="30" y="50" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Tách biệt COPY package.json trước lệnh RUN npm install để tối ưu Layer Caching khi sửa đổi server.js.</text>
    <text x="30" y="70" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Sử dụng biến môi trường ENV PORT=3000 kết hợp EXPOSE 3000 và CMD dạng Exec Form để truyền tín hiệu POSIX mượt mà.</text>
  </g>
</svg>
